<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Verificar trámite · Registro Marítimo Digital</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="interior-page verificacion-page">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="an" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v13M5 14a7 7 0 0 0 14 0M8 11H5M19 11h-3"/></symbol>
  </defs>
</svg>

<header class="bar">
  <a
    class="logo marca-registro"
    href="verificar.html"
    aria-label="Registro Marítimo Digital"
  >
    <img
      class="marca-logo"
      src="img/logo-amp.png"
      alt="Autoridad Marítima de Panamá"
    >

    <span class="marca-texto">
      <strong>Registro Marítimo</strong>
      <span>Digital</span>
    </span>
  </a>
<a class="acceso-publico" href="login.html">Iniciar sesión</a>
</header>

<main class="interior-main">
  <section class="band formulario-band" aria-labelledby="titulo-verificacion">
    <div class="formulario-band-contenido">
      <span class="formulario-etiqueta">CONSULTA PÚBLICA</span>
      <h1 id="titulo-verificacion">Verifica un certificado</h1>

      <p>
        Consulta su estado y vigencia con el código de verificación
        o el enlace del QR.
      </p>
    </div>
  </section>

  <section class="tc interior-panel" aria-labelledby="titulo-consulta">
    <div class="interior-encabezado">
      <span class="portal-panel-etiqueta">VERIFICACIÓN DEL REGISTRO</span>
      <h2 id="titulo-consulta">Consulta del certificado</h2>

      <p class="interior-ayuda" id="codigo-ayuda">
        Escribe el código que aparece en el certificado.
        No necesitas iniciar sesión.
      </p>
    </div>

    <form id="form-verificar">
      <label for="codigo">Código de verificación</label>

      <div class="verificacion-entrada">
        <input
          id="codigo"
          type="text"
          maxlength="20"
          placeholder="XXXX-XXXX-XXXX"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          aria-describedby="codigo-ayuda"
          required
        >
        <button type="submit" id="verificar">Verificar</button>
      </div>
    </form>

    <div
      id="resultado"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
  </section>
</main>

<script src="verificar.js"></script>
</body>
</html>
