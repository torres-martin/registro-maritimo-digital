spring.datasource.url=jdbc:mysql://localhost:3306/amp_registro_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Dirección pública del sitio: es la que lleva el código QR del certificado.
# Debe poder abrirse desde el celular de quien escanea (ej. https://registro.midominio.com).
app.base-url=${APP_BASE_URL:http://localhost:8080}
