spring.datasource.url=jdbc:mysql://localhost:3306/amp_registro_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# DEF-09: el esquema lo maneja Flyway (src/main/resources/db/migration).
# Hibernate ya no crea ni altera tablas: solo verifica que coincidan con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Bases que ya existían (creadas por Hibernate antes del Sprint 7): se marcan
# en la versión 0 y luego se les aplican V1, V2... (los scripts son idempotentes).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Dirección pública del sitio: es la que lleva el código QR del certificado.
# Debe poder abrirse desde el celular de quien escanea (ej. https://registro.midominio.com).
app.base-url=${APP_BASE_URL:http://localhost:8080}
